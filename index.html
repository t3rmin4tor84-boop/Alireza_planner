<!doctype html><html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111827">
<title>Mahdi Planner</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--txt:#111827;--muted:#6b7280;--line:#e5e7eb;--p:#4f46e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,sans-serif}
.app{max-width:1050px;margin:auto;padding:14px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #0000000b}
.hero{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;border:0}.metric{font-size:38px;font-weight:900}.bar{height:10px;background:#ffffff33;border-radius:9px;overflow:hidden}.fill{height:100%;background:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.field{padding:14px 0;border-bottom:1px solid var(--line)}.range{width:100%;accent-color:var(--p)}
.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:700;background:#111827;color:#fff}.secondary{background:#f1f3f5;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.nav{position:fixed;z-index:5;bottom:10px;left:10px;right:10px;max-width:1030px;margin:auto;background:#fffffff2;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.nav button{border:0;background:transparent;padding:8px;border-radius:15px;color:#6b7280}.nav button.active{background:#eef2ff;color:var(--p);font-weight:800}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day,.dow{text-align:center}.day{min-height:55px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:6px}.today{outline:2px solid var(--p)}.good{color:#16a34a;font-weight:800}.mid{color:#d97706;font-weight:800}.bad{color:#dc2626;font-weight:800}
.chart{height:170px;display:flex;align-items:end;gap:5px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center}.stick{width:80%;max-width:30px;background:linear-gradient(#7c3aed,#4f46e5);border-radius:7px 7px 2px 2px}
@media(max-width:700px){.grid{display:block}.card{border-radius:18px}}
</style></head><body><div class="app">
<header class="top"><div><b class="brand">Mahdi Planner</b><div class="muted" id="today"></div></div><button class="btn secondary" onclick="theme()">◐</button></header>
<nav class="nav"><button id="n0" onclick="go('today')">✓<br>امروز</button><button id="n1" onclick="go('calendar')">▦<br>تقویم</button><button id="n2" onclick="go('stats')">◒<br>آمار</button><button id="n3" onclick="go('settings')">⚙<br>تنظیمات</button></nav>
<main id="main"></main></div>
<script>
const K='mahdi_planner_final',months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const defaults=[['ورزش',15],['مطالعه',15],['کار اصلی',30],['زبان',10],['خواب',15],['عادت شخصی',15]];
let S=JSON.parse(localStorage.getItem(K)||'null')||{fields:defaults.map((x,i)=>({id:'f'+i,name:x[0],weight:x[1]})),days:{},dark:false};
let sel=new Date(),page='today';
const save=()=>localStorage.setItem(K,JSON.stringify(S)), key=d=>d.toISOString().slice(0,10);
function jp(d){let gy=d.getFullYear(),gm=d.getMonth()+1,gd=d.getDate(),a=[0,31,59,90,120,151,181,212,243,273,304,334],g2=gm>2?gy+1:gy,days=355666+365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)+gd+a[gm-1],jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function jg(y,m,d){let gy=y+621,days=-355668+365*gy+Math.floor(gy/33)*8+Math.floor((gy%33+3)/4)+d+(m<7?(m-1)*31:(m-7)*30+186),x=new Date(0);x.setUTCDate(days+400);return new Date(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate())}
function jl(d){let x=jp(d);return x[2]+' '+months[x[1]-1]+' '+x[0]}
function sc(d){let r=S.days[key(d)]||{},w=S.fields.reduce((a,f)=>a+f.weight,0)||1;return Math.round(S.fields.reduce((a,f)=>a+(+r[f.id]||0)*f.weight,0)/w)}
function avg(n,o=0){let s=0;for(let i=o;i<o+n;i++){let d=new Date(sel);d.setDate(d.getDate()-i);s+=sc(d)}return Math.round(s/n)}
function render(){document.getElementById('today').textContent=jl(new Date());[0,1,2,3].forEach(i=>document.getElementById('n'+i).classList.toggle('active',['today','calendar','stats','settings'][i]==page));({today:today,calendar:calendar,stats:stats,settings:settings}[page])()}
function go(p){page=p;render()}
function setv(id,v){let k=key(sel);S.days[k]??={};S.days[k][id]=+v;save();render()}
function today(){let r=S.days[key(sel)]||{},s=sc(sel);document.getElementById('main').innerHTML=`<div class="grid"><section class="card hero"><div class="muted">امتیاز روز</div><div class="metric">${s}%</div><div class="bar"><div class="fill" style="width:${s}%"></div></div><div style="margin-top:12px">${jl(sel)}</div></section><section class="card"><div class="muted">میانگین ۷ روز</div><div class="metric">${avg(7)}%</div><div class="muted">میانگین ۳۰ روز: ${avg(30)}%</div></section><section class="card full"><div class="row"><b>عملکرد روز</b><div class="actions"><button class="btn secondary" onclick="sel.setDate(sel.getDate()-1);render()">‹</button>${jl(sel)}<button class="btn secondary" onclick="sel.setDate(sel.getDate()+1);render()">›</button></div></div>${S.fields.map(f=>`<div class="field"><div class="row"><b>${f.name}</b><b>${r[f.id]||0}%</b></div><div class="muted">وزن ${f.weight}%</div><input class="range" type="range" min="0" max="100" value="${r[f.id]||0}" oninput="setv('${f.id}',this.value)"></div>`).join('')}<div class="actions"><button class="btn" onclick="S.days[key(sel)]={};S.fields.forEach(f=>S.days[key(sel)][f.id]=100);save();render()">تکمیل همه</button><button class="btn secondary" onclick="delete S.days[key(sel)];save();render()">پاک کردن روز</button></div></section></div>`}
function calendar(){let [y,m]=jp(sel),first=jg(y,m,1),next=m==12?jg(y+1,1,1):jg(y,m+1,1),len=Math.round((next-first)/86400000),start=(first.getDay()+1)%7,c='';for(let i=0;i<start;i++)c+='<div></div>';for(let d=1;d<=len;d++){let x=new Date(first);x.setDate(x.getDate()+d-1);let s=sc(x);c+=`<button class="day" onclick="sel=new Date(${x.getTime()});go('today')"><b>${d}</b><br><span class="${s>=70?'good':s>=40?'mid':'bad'}">${s}%</span></button>`}document.getElementById('main').innerHTML=`<section class="card"><div class="row"><button class="btn secondary" onclick="chg(-1)">ماه قبل</button><b>${months[m-1]} ${y}</b><button class="btn secondary" onclick="chg(1)">ماه بعد</button></div><div class="calendar" style="margin-top:15px">${['ش','ی','د','س','چ','پ','ج'].map(x=>'<div class="dow muted">'+x+'</div>').join('')}${c}</div></section>`}
function chg(n){let[y,m]=jp(sel);m+=n;if(m<1){y--;m=12}if(m>12){y++;m=1}sel=jg(y,m,1);render()}
function stats(){let v=[];for(let i=13;i>=0;i--){let d=new Date(sel);d.setDate(d.getDate()-i);v.push(sc(d))}document.getElementById('main').innerHTML=`<section class="card"><div class="row"><b>روند ۱۴ روزه</b><b>${avg(14)}%</b></div><div class="chart">${v.map(x=>'<div class="col"><div class="stick" style="height:'+Math.max(3,x*1.45)+'px"></div><small class="muted">'+x+'</small></div>').join('')}</div></section><section class="card"><b>مقایسه دوره‌ای</b><p>۷ روز اخیر: ${avg(7)}% · ۷ روز قبل: ${avg(7,7)}%</p><p>۳۰ روز اخیر: ${avg(30)}% · ۳۰ روز قبل: ${avg(30,30)}%</p></section>`}
function settings(){document.getElementById('main').innerHTML=`<section class="card"><div class="row"><b>فیلدها</b><button class="btn" onclick="add()">+ افزودن</button></div>${S.fields.map(f=>`<div class="field"><div class="row"><b>${f.name}</b><span>وزن ${f.weight}%</span></div><div class="actions"><button class="btn secondary" onclick="edit('${f.id}')">ویرایش</button><button class="btn danger" onclick="S.fields=S.fields.filter(x=>x.id!='${f.id}');save();render()">حذف</button></div></div>`).join('')}</section><section class="card"><b>پشتیبان</b><p class="muted">داده‌ها فقط روی همین دستگاه ذخیره می‌شوند.</p><button class="btn" onclick="let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mahdi-planner.json';a.click()">خروجی JSON</button></section>`}
function add(){let n=prompt('نام فیلد');if(n){S.fields.push({id:'f'+Date.now(),name:n,weight:10});save();render()}}
function edit(id){let f=S.fields.find(x=>x.id==id),n=prompt('نام',f.name),w=prompt('وزن',f.weight);if(n){f.name=n;f.weight=+w||f.weight;save();render()}}
function theme(){S.dark=!S.dark;document.documentElement.style.setProperty('--bg',S.dark?'#0b1020':'#f5f7fb');document.documentElement.style.setProperty('--card',S.dark?'#111827':'#fff');document.documentElement.style.setProperty('--txt',S.dark?'#fff':'#111827');save()}
theme();theme();render();
</script></body></html>
